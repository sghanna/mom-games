<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05130d">
<link rel="icon" href="solitaire/icons/icon-192.png">
<link rel="stylesheet" href="site.css">
<title>Mom's Games</title>
</head>
<body>
<main>
  <h1>Mom's Games</h1>
  <p class="lead">Card games made to be easy to see. No ads, no sign-in.</p>

  <ul class="games">
    <li>
      <a class="tile" href="solitaire/">
        <img src="solitaire/icons/icon-192.png" alt="">
        <span class="words"><strong>Solitaire</strong><span class="sub">Classic Klondike solitaire</span></span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4l8 8-8 8" stroke="#fbbf24" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </li>
    <li>
      <a class="tile" href="hearts/">
        <img src="hearts/icons/icon-192.png" alt="">
        <span class="words"><strong>Hearts</strong><span class="sub">Play against three computer players</span></span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4l8 8-8 8" stroke="#fbbf24" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </li>
  </ul>

  <p class="tip">To keep a game on your iPhone, open it in Safari, tap Share, then tap Add to Home Screen.</p>

  <a class="pill" href="about.html">About these games</a>
</main>
</body>
</html>
